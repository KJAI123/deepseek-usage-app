name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  macos:
    name: Build macOS (arm64 + x86_64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build app + widget + dashboard
        run: |
          cd apps/macos
          bash ./build.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekUsagePanel-macOS
          path: apps/macos/DeepSeekUsagePanel.app

  windows:
    name: Build Windows (Tauri)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Windows installer (NSIS)
        run: |
          cd apps/windows
          npm install
          npx tauri build

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekUsagePanel-Windows
          path: |
            apps/windows/src-tauri/target/release/bundle/nsis/*.exe
            apps/windows/src-tauri/target/release/*.exe

  release:
    name: Publish GitHub Release (on tag)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
