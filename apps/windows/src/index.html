<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>DeepSeek 用量</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #dbe7ff;
  }
  .panel {
    width: 100%; height: 100%;
    background: linear-gradient(150deg, rgba(16,24,48,0.96), rgba(10,18,38,0.96));
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 10px 14px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .row { display: flex; align-items: center; justify-content: space-between; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #f59e0b; flex: none; }
  .dot.ok { background: #34d399; }
  .dot.err { background: #f87171; }
  .title { font-size: 12px; color: #7d90b8; }
  .side { margin-left: auto; font-size: 11px; color: #6b7fa8; white-space: nowrap; }
  .balance { font-size: 26px; font-weight: 700; color: #4da3ff; letter-spacing: 0.5px; }
  .balance.dim { color: #7d90b8; }
  .foot { font-size: 10px; color: #5b6c8f; }
  .btns { display: flex; gap: 6px; margin-top: 2px; }
  button {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.14);
    color: #aabce0;
    border-radius: 6px;
    padding: 3px 10px;
    font-size: 11px;
    cursor: pointer;
    flex: 1;
  }
  button:hover { background: rgba(255,255,255,0.16); }
  button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
</style>
</head>
<body>
<div class="panel" data-tauri-drag-region>
  <div class="row">
    <span class="title" id="title">DeepSeek 余额</span>
    <span class="side" id="side"></span>
    <span class="dot" id="dot"></span>
  </div>
  <div class="balance dim" id="balance">—</div>
  <div class="foot" id="foot">未设置 Key 请点设置</div>
  <div class="btns">
    <button id="refresh" class="primary">刷新</button>
    <button id="dashboard">看板</button>
    <button id="settings">设置</button>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const invoke = (cmd, args) => window.__TAURI__.core.invoke(cmd, args);

  let interval = 60;
  let timer = 0;
  let curMode = 0;           // 0=自动 1=CNY 2=USD
  const USD_RATE = 7.2;      // 1 USD = 7.2 CNY

  function moneySpec(b) {
    const cur = (b.currency || "CNY").toUpperCase();
    switch (curMode) {
      case 1: return { sign: "¥", rate: 1 };
      case 2: return { sign: "$", rate: 1 / USD_RATE };
      default:
        if (cur === "USD" || cur === "US") return { sign: "$", rate: 1 };
        if (cur === "EUR") return { sign: "€", rate: 1 };
        return { sign: "¥", rate: 1 };
    }
  }
  function fmtMoney(v, sign, rate) {
    const n = (parseFloat(v) || 0) * rate;
    return sign + " " + n.toFixed(2);
  }

  // 副账号一行摘要：DeepSeek 显示余额，智谱显示 5h/本周剩余
  function paintSide(sb) {
    const el = $("side");
    if (!sb || sb.error) { el.textContent = ""; return; }
    if ((sb.provider || "") === "zhipu") {
      const rem5 = (typeof sb.q5_pct === "number" && sb.q5_pct >= 0) ? Math.max(0, 100 - sb.q5_pct) : null;
      const remW = (typeof sb.qw_pct === "number" && sb.qw_pct >= 0) ? Math.max(0, 100 - sb.qw_pct) : null;
      el.textContent = "智谱 " + (rem5 === null ? "—" : rem5 + "%") + "/" + (remW === null ? "—" : remW + "%");
    } else {
      el.textContent = "DS ¥" + (parseFloat(sb.total) || 0).toFixed(0);
    }
  }

  function paint(b) {
    const dot = $("dot");
    const bal = $("balance");
    paintSide(b.secondary);
    if (b.error) {
      dot.className = "dot err";
      bal.textContent = "—";
      bal.classList.add("dim");
      $("foot").textContent = b.error;
      return;
    }
    dot.className = b.available ? "dot ok" : "dot err";
    const spec = moneySpec(b);
    const isZhipu = (b.provider || "") === "zhipu";

    // 智谱：主数字是 Coding Plan 的 5 小时剩余额度，本周额度放在副行
    if (isZhipu) {
      const rem5 = (typeof b.q5_pct === "number" && b.q5_pct >= 0) ? Math.max(0, 100 - b.q5_pct) : null;
      const remW = (typeof b.qw_pct === "number" && b.qw_pct >= 0) ? Math.max(0, 100 - b.qw_pct) : null;
      $("title").textContent = "智谱 用量";
      bal.textContent = rem5 === null ? "—" : (rem5 + "%");
      bal.classList.toggle("dim", rem5 === null);
      if (rem5 === 0) bal.style.color = "#f87171";
      else if (rem5 !== null && rem5 < 10) bal.style.color = "#f59e0b";
      else bal.style.color = "#4da3ff";
      if (remW !== null && remW === 0) dot.className = "dot err";   // 本周用尽
      const parts = [];
      parts.push(remW === null ? "本周额度 —" : "本周额度 " + remW + "%");
      if (b.plan) parts.push(b.plan);
      $("foot").textContent = parts.join(" · ");
      return;
    }

    bal.style.color = "";
    bal.textContent = fmtMoney(b.total, spec.sign, spec.rate);
    bal.classList.remove("dim");
    $("title").textContent = "DeepSeek 余额";
    const t = b.updated_at ? new Date(b.updated_at * 1000).toLocaleTimeString("zh-CN") : "—";
    $("foot").textContent = "更新于 " + t;
  }

  async function refreshNow() {
    const b = await invoke("refresh");
    paint(b);
  }

  async function load() {
    const [cfg, b] = await Promise.all([invoke("get_config"), invoke("get_balance_cached")]);
    interval = (cfg.refresh_interval || 60) * 1000;
    curMode = (cfg.display_currency === undefined ? 0 : cfg.display_currency);
    paint(b);
    if (!cfg.api_key) { $("foot").textContent = "未设置 Key，请点设置"; }
  }

  $("refresh").addEventListener("click", refreshNow);
  $("dashboard").addEventListener("click", () => invoke("open_dashboard"));
  $("settings").addEventListener("click", () => invoke("open_settings"));

  setInterval(refreshNow, 60000); // 保底每分钟
  load();
  refreshNow();
</script>
</body>
</html>
