<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepSeek 用量看板</title>
<script src="echarts.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #2e2e33 0%, #212126 55%, #1b1b20 100%);
    color: #ececf1;
    padding: 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .topbar { display: flex; align-items: center; gap: 8px; }
  .range { display: flex; gap: 8px; margin-right: auto; }
  .btn {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.13);
    color: #b4b4bf;
    border-radius: 8px;
    padding: 5px 14px;
    font-size: 12px;
    cursor: pointer;
    transition: all .15s;
  }
  .btn:hover { background: rgba(255,255,255,0.13); }
  .btn.active { background: var(--accent, #484851); border-color: var(--accent, #484851); color: #fff; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .card {
    background: rgba(255,255,255,0.055);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 12px;
    padding: 10px 14px;
    min-height: 64px;
  }
  .card .label { font-size: 11px; color: #9b9ba6; margin-bottom: 4px; }
  .card .value { font-size: 21px; font-weight: 700; letter-spacing: 0.5px; color: #ffffff; }
  .card .value.bal { color: var(--accent, #ffffff); }
  .card .value.use { color: #ff9f4a; }
  .card .value.up { color: #5fd97f; }
  .card .value.warn { color: #ff6b6b; }
  #chart { flex: 1; min-height: 250px; }

  /* 小尺寸（悬浮窗看板模式 ~420×340）适配 */
  @media (max-width: 440px) {
    body { padding: 8px 10px; gap: 6px; }
    .topbar { flex-wrap: wrap; }
    .stats { grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .card { padding: 6px 9px; min-height: 48px; }
    .card .label { font-size: 10px; margin-bottom: 2px; }
    .card .value { font-size: 15px; }
    .btn { padding: 3px 10px; font-size: 11px; }
    #chart { min-height: 120px; }
    .cfg-panel { left: 10px; right: 10px; top: 46px; width: auto; }
  }

  .cfg-panel {
    position: fixed; right: 18px; top: 54px;
    width: 236px;
    background: rgba(30,30,35,0.97);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 12px;
    padding: 12px 14px;
    z-index: 50;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .cfg-title { font-size: 13px; font-weight: 600; color: #ececf1; margin-bottom: 8px; }
  .cfg-sec { font-size: 11px; color: #9b9ba6; margin: 10px 0 5px; }
  .cfg-panel label {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: #c9c9d2;
    padding: 3px 0; cursor: pointer;
  }
  .cfg-panel input { accent-color: var(--accent, #63d3c2); }
  .cfg-actions { display: flex; gap: 8px; margin-top: 12px; }
  .cfg-actions .btn { flex: 1; text-align: center; }
  .cfg-actions .btn.primary { background: var(--accent, #484851); border-color: var(--accent, #484851); color: #fff; }
  .mask { position: fixed; inset: 0; z-index: 40; background: transparent; }
</style>
</head>
<body>
<div class="topbar">
  <div class="range">
    <button class="btn active" data-range="7" data-i18n="近 7 天">近 7 天</button>
    <button class="btn" data-range="30" data-i18n="近 30 天">近 30 天</button>
    <button class="btn" data-range="0" data-i18n="全部">全部</button>
  </div>
  <button class="btn" id="cfgBtn" data-i18n="自定义显示">⚙ 自定义显示</button>
</div>
<div class="stats" id="stats"></div>
<div id="chart"></div>

<div class="mask" id="mask" hidden></div>
<div class="cfg-panel" id="cfgPanel" hidden>
  <div class="cfg-title" data-i18n="自定义显示">自定义显示</div>
  <div class="cfg-sec" data-i18n="数据卡片（勾选显示）">数据卡片（勾选显示）</div>
  <label><input type="checkbox" data-card="cur"> <span data-i18n="当前余额">当前余额</span></label>
  <label><input type="checkbox" data-card="today"> <span data-i18n="今日消耗">今日消耗</span></label>
  <label><input type="checkbox" data-card="cum"> <span data-i18n="累计消耗">累计消耗</span></label>
  <label><input type="checkbox" data-card="topup"> <span data-i18n="累计充值">累计充值</span></label>
  <label><input type="checkbox" data-card="days"> <span data-i18n="记录天数">记录天数</span></label>
  <label><input type="checkbox" data-card="max"> <span data-i18n="区间最高余额">区间最高余额</span></label>
  <label><input type="checkbox" data-card="left"> <span data-i18n="预估可用">预估可用</span></label>
  <div class="cfg-sec" data-i18n="图表模式">图表模式</div>
  <label><input type="radio" name="mode" value="balance"> <span data-i18n="余额趋势">余额趋势</span></label>
  <label><input type="radio" name="mode" value="usage"> <span data-i18n="每日使用量">每日使用量</span></label>
  <label><input type="radio" name="mode" value="compare"> <span data-i18n="余额 + 使用量对比">余额 + 使用量对比</span></label>
  <div class="cfg-actions">
    <button class="btn primary" id="cfgSave" data-i18n="保存">保存</button>
    <button class="btn" id="cfgCancel" data-i18n="取消">取消</button>
  </div>
</div>

<script>
const DEFAULT_CFG = { cards: ["cur","today","cum","topup","days","max","left"], mode: "balance" };
const ALL_CARDS = ["cur","today","cum","topup","days","max","left","plan","planEnd"];

/* ---------- 本地化（zh / en） ---------- */
const I18N = {
  "近 7 天": "Last 7 Days", "近 30 天": "Last 30 Days", "全部": "All",
  "自定义显示": "Customize", "数据卡片（勾选显示）": "Cards (check to show)",
  "当前余额": "Balance", "今日消耗": "Today", "累计消耗": "Total Usage",
  "累计充值": "Top-ups", "记录天数": "Days", "区间最高余额": "Peak Balance",
  "预估可用": "Days Left", "图表模式": "Chart Mode",
  "余额趋势": "Balance", "每日使用量": "Daily Usage", "余额 + 使用量对比": "Balance + Usage",
  "保存": "Save", "取消": "Cancel", "天": "d",
  "余额": "Balance", "使用量": "Usage", "余额: ": "Balance: ", "使用量: ": "Usage: ",
  "套餐": "Plan", "套餐到期": "Plan Expiry", "无套餐": "No plan"
};
function T(key, lang) {
  const l = lang || ((window.__DS_DATA__ && window.__DS_DATA__.lang) || "zh");
  return l === "en" ? (I18N[key] || key) : key;
}
function applyLang(lang) {
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = T(el.getAttribute("data-i18n"), lang);
  });
}

let range = 7;
let cfg = loadCfg();

function loadCfg() {
  try {
    const raw = localStorage.getItem("ds_dash_cfg");
    if (raw) {
      const c = JSON.parse(raw);
      // 新版本新增卡片自动补入（如预估可用），不干扰用户已有的隐藏选择
      if (c.cards && c.cards.indexOf("left") < 0) c.cards = c.cards.concat("left");
      return Object.assign({}, DEFAULT_CFG, c);
    }
  } catch (e) {}
  return Object.assign({}, DEFAULT_CFG);
}
function saveCfg(c) {
  try { localStorage.setItem("ds_dash_cfg", JSON.stringify(c)); } catch (e) {}
}

// 转发 console 到宿主（macOS WKWebView 调试用）
if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.log) {
  console.log = function () {
    try { window.webkit.messageHandlers.log.postMessage(Array.prototype.slice.call(arguments).join(" ")); } catch (e) {}
  };
}

// 数据获取：macOS 端由宿主注入 window.__DS_DATA__；Tauri/Web 端通过 invoke 拉取
function fetchData(cb) {
  if (window.__DS_DATA__) { cb(window.__DS_DATA__); return; }
  if (window.__TAURI__ && window.__TAURI__.core) {
    Promise.all([
      window.__TAURI__.core.invoke("get_balance_cached"),
      window.__TAURI__.core.invoke("get_history")
    ]).then(function (res) {
      const b = res[0] || {};
      cb({ sign: "¥", current: b.total || "", entries: res[1] || [] });
    }).catch(function () { cb({ sign: "¥", current: "", entries: [] }); });
    return;
  }
  cb({ sign: "¥", current: "", entries: [] });
}

function boot() {
  fetchData(function (D) {
    window.__DS_DATA__ = D;
    renderDashboard();
  });
}

/* ---------- 用量（消耗）计算 ---------- */
// 相邻两条余额下降 → 消耗；上升 → 充值/赠送
function splitUsage(entries) {
  const sorted = entries.slice().sort((a, b) => a.ts - b.ts);
  const usage = [];   // {ts, amount}
  let topup = 0;
  for (let i = 1; i < sorted.length; i++) {
    const prev = parseFloat(sorted[i - 1].total) || 0;
    const cur = parseFloat(sorted[i].total) || 0;
    const diff = prev - cur;
    if (diff > 0.001) usage.push({ ts: sorted[i].ts, amount: diff });
    else if (diff < -0.001) topup += -diff;
  }
  return { usage: usage, topup: topup };
}

function dayKey(ts) {
  const d = new Date(ts * 1000);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function dayZeroTs(k) {
  const p = k.split("-").map(Number);
  return new Date(p[0], p[1] - 1, p[2]).getTime() / 1000;
}
function usageByDay(usage, maxDays) {
  const agg = {};
  const cutoff = maxDays > 0 ? Date.now() / 1000 - maxDays * 86400 : 0;
  usage.forEach(u => {
    if (u.ts < cutoff) return;
    const k = dayKey(u.ts);
    agg[k] = (agg[k] || 0) + u.amount;
  });
  return Object.keys(agg).sort().map(k => ({ day: k, amount: agg[k] }));
}

/* ---------- 渲染 ---------- */
function renderCards(D) {
  const entries = (D.entries || []).slice();
  const sign = D.sign || "¥";
  const { usage, topup } = splitUsage(entries);

  const now = new Date();
  const dayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime() / 1000;
  // 今日消耗：与悬浮窗一致用"差分求和"（充值不抵消耗），避免今日充值导致首尾差低估
  let todayUsage = 0;
  for (let i = 1; i < entries.length; i++) {
    if ((parseFloat(entries[i].ts) || 0) < dayStart) continue;
    const prev = parseFloat(entries[i - 1].total) || 0;
    const cur = parseFloat(entries[i].total) || 0;
    const diff = prev - cur;
    if (diff > 0.001) todayUsage += diff;
  }
  const cumUsage = usage.reduce((s, u) => s + u.amount, 0);
  // 累计充值：官方充值余额优先（用户实际充值的钱），记录期内充值事件作为补充
  const topped = parseFloat(D.topped || "0") || 0;
  const cumTopup = Math.max(topup, topped);
  // 记录天数：实际有记录的自然日数（含首尾）
  const daySet = new Set(entries.map(e => Math.floor((parseFloat(e.ts) || 0) / 86400)));
  const dayCount = daySet.size;
  const maxV = entries.reduce((m, e) => Math.max(m, parseFloat(e.total) || 0), 0);
  // 预估可用天数：充值余额 ÷ 近 7 天日均消耗（数据不足时按已有天数）
  const usage7 = usageByDay(usage, 7);
  const daysCovered = usage7.length;
  let daysLeft = null;
  if (daysCovered >= 1 && cumTopup > 0.001) {
    const dailyAvg = usage7.reduce((s, u) => s + u.amount, 0) / daysCovered;
    if (dailyAvg > 0.001) daysLeft = cumTopup / dailyAvg;
  }
  const lang = D.lang || "zh";

  const isZhipu = (D.provider === "zhipu");
  const data = {
    cur: { label: T(isZhipu ? "余额" : "当前余额", lang), cls: "bal", text: D.current ? sign + D.current : "—" },
    today: { label: T("今日消耗", lang), cls: "use", text: todayUsage > 0.001 ? sign + todayUsage.toFixed(2) : "0.00" },
    cum: { label: T("累计消耗", lang), cls: "use", text: cumUsage > 0.001 ? sign + cumUsage.toFixed(2) : "0.00" },
    topup: { label: T("累计充值", lang), cls: "up", text: cumTopup > 0.001 ? "+" + sign + cumTopup.toFixed(2) : "0.00" },
    days: { label: T("记录天数", lang), cls: "bal", text: dayCount ? dayCount + " " + T("天", lang) : "—" },
    max: { label: T("区间最高余额", lang), cls: "bal", text: entries.length ? sign + maxV.toFixed(2) : "—" },
    left: { label: T("预估可用", lang), cls: (daysLeft != null && daysLeft < 1) ? "warn" : "bal", text: daysLeft != null ? Math.floor(daysLeft) + " " + T("天", lang) : "—" }
  };

  // 智谱：没有"今日消耗/累计消耗/充值/预估可用"口径，这些卡片换成就「套餐 / 套餐到期」
  if (isZhipu) {
    data.plan = { label: T("套餐", lang), cls: "bal", text: D.plan ? D.plan : T("无套餐", lang) };
    data.planEnd = { label: T("套餐到期", lang), cls: "bal", text: D.planUntil ? D.planUntil : "—" };
  }
  const cardKeys = cfg.cards.map(k => {
    if (!isZhipu) return k;
    if (k === "today") return "plan";
    if (k === "cum") return "planEnd";
    if (k === "topup" || k === "left") return null;
    return k;
  }).filter(k => k !== null);
  const visible = ALL_CARDS.filter(k => cardKeys.indexOf(k) >= 0 && data[k]);
  const statsEl = document.getElementById("stats");
  statsEl.style.gridTemplateColumns = "repeat(" + Math.min(4, Math.max(1, visible.length)) + ", 1fr)";
  let html = "";
  visible.forEach(k => {
    const c = data[k];
    html += '<div class="card"><div class="label">' + c.label + '</div><div class="value ' + c.cls + '">' + c.text + '</div></div>';
  });
  statsEl.innerHTML = html;
  return { todayUsage: todayUsage, cumUsage: cumUsage, dayCount: dayCount, maxV: maxV, topup: topup };
}

function renderDashboard() {
  const D = window.__DS_DATA__ || { sign: "¥", current: "", entries: [] };
  if (D.accent) {
    document.documentElement.style.setProperty("--accent", D.accent);
  }
  applyLang(D.lang);
  renderCards(D);
  drawChart(D, (D.entries || []).slice());
}

function drawChart(D, all) {
  const el = document.getElementById("chart");
  const chart = echarts.getInstanceByDom(el) || echarts.init(el);
  const sign = D.sign || "¥";
  const accent = D.accent || "#63d3c2";
  const lang = D.lang || "zh";
  const tBal = T("余额", lang), tUse = T("使用量", lang);
  const tBalColon = T("余额: ", lang), tUseColon = T("使用量: ", lang);

  let list = all;
  if (range > 0) {
    const cutoff = Date.now() / 1000 - range * 86400;
    list = all.filter(e => e.ts >= cutoff);
  }
  const byDay = {};
  list.forEach(e => {
    const k = dayKey(e.ts);
    // 曲线点固定在"该日 0 点"，避免按最后采样时刻导致跨天时 X 轴日期挤到同一天
    byDay[k] = { ts: dayZeroTs(k), total: e.total };
  });
  const { usage } = splitUsage(all);
  const useDays = usageByDay(usage, range);
  const useByTs = {};
  useDays.forEach(u => { useByTs[new Date(u.day + "T00:00:00").getTime()] = +u.amount.toFixed(2); });

  // 一天一格：X 轴固定为时间范围内每个自然日，无数据的天补空位（null 断点）
  const now = new Date();
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let from = todayStart;
  if (range > 0) {
    from = new Date(todayStart.getTime() - (range - 1) * 86400000);
  } else if (list.length > 0) {
    const earliest = list.reduce((m, e) => Math.min(m, parseFloat(e.ts) || 0), Infinity);
    from = new Date(dayZeroTs(dayKey(earliest)) * 1000);
    if (from.getTime() > todayStart.getTime()) from = todayStart;
  }
  const tsList = [], labels = [];
  for (let d = new Date(from); d.getTime() <= todayStart.getTime(); d = new Date(d.getTime() + 86400000)) {
    tsList.push(d.getTime());
    labels.push((d.getMonth() + 1) + "/" + d.getDate());
  }
  // category 轴：series 数据必须与 labels 对齐的单值数组（null 为无数据天）
  const balVals = tsList.map(ts => {
    const k = dayKey(ts / 1000);
    return byDay[k] ? parseFloat(byDay[k].total) : null;
  });
  const useVals = tsList.map(ts => useByTs[ts] !== undefined ? useByTs[ts] : null);

  const tooltipCommon = {
    trigger: "axis",
    backgroundColor: "rgba(28,28,33,0.95)",
    borderColor: "rgba(255,255,255,0.15)",
    textStyle: { color: "#ececf1", fontSize: 12 }
  };
  const xCommon = {
    type: "category",
    data: labels,
    boundaryGap: false,
    axisLine: { lineStyle: { color: "#3a3a42" } },
    axisTick: { show: false },
    axisLabel: { color: "#9b9ba6", fontSize: 11, hideOverlap: true },
    splitLine: { show: false }
  };
  const yCommon = {
    type: "value", scale: true,
    splitLine: { lineStyle: { color: "rgba(255,255,255,0.07)" } },
    axisLabel: { color: "#9b9ba6", fontSize: 11 }
  };
  const base = {
    backgroundColor: "transparent",
    animationDuration: 400,
    grid: { left: 64, right: 28, top: 30, bottom: 44 },
    tooltip: tooltipCommon,
    xAxis: xCommon,
    yAxis: yCommon
  };

  if (cfg.mode === "usage") {
    chart.setOption(Object.assign({}, base, {
      tooltip: Object.assign({}, tooltipCommon, {
        formatter: function (params) {
          const p = params[0];
          return p.name + "<br/>" + tUseColon + sign + (p.value == null ? "—" : p.value.toFixed(2));
        }
      }),
      series: [{
        name: tUse,
        type: "bar",
        data: useVals,
        barMaxWidth: 30,
        itemStyle: { color: "#ff9f4a", borderRadius: [4,4,0,0] },
        label: { show: useVals.length <= 14, position: "top", color: "#ff9f4a", fontSize: 10, formatter: p => (p.value == null ? "" : sign + p.value.toFixed(2)) }
      }]
    }), true);
  } else if (cfg.mode === "compare") {
    chart.setOption(Object.assign({}, base, {
      tooltip: Object.assign({}, tooltipCommon, {
        formatter: function (params) {
          let s = "";
          params.forEach(p => {
            s += p.name + "<br/>";
            if (p.seriesName === tBal) s += tBalColon + sign + (p.value == null ? "—" : p.value.toFixed(2));
            else s += tUseColon + sign + (p.value == null ? "—" : p.value.toFixed(2));
            s += "<br/>";
          });
          return s;
        }
      }),
      yAxis: [yCommon, Object.assign({}, yCommon, { splitLine: { show: false } })],
      series: [
        {
          name: tBal, type: "line", data: balVals, smooth: true,
          symbol: "circle", symbolSize: 6, showSymbol: balVals.length <= 40,
          yAxisIndex: 0,
          lineStyle: { width: 2.5, color: accent },
          itemStyle: { color: accent, borderColor: "#1b1b20", borderWidth: 1 },
          areaStyle: { color: { type: "linear", x: 0, y: 0, x2: 0, y2: 1, colorStops: [
            { offset: 0, color: accent + "52" }, { offset: 1, color: accent + "08" }
          ] } }
        },
        {
          name: tUse, type: "bar", data: useVals, yAxisIndex: 1,
          barMaxWidth: 22,
          itemStyle: { color: "rgba(255,159,74,0.75)", borderRadius: [4,4,0,0] }
        }
      ]
    }), true);
  } else {
    chart.setOption(Object.assign({}, base, {
      tooltip: Object.assign({}, tooltipCommon, {
        formatter: function (params) {
          const p = params[0];
          return p.name + "<br/>" + tBalColon + sign + (p.value == null ? "—" : p.value.toFixed(2));
        }
      }),
      series: [{
        name: tBal,
        type: "line", data: balVals, smooth: true,
        symbol: "circle", symbolSize: 6, showSymbol: balVals.length <= 40,
        lineStyle: { width: 2.5, color: accent },
        itemStyle: { color: accent, borderColor: "#1b1b20", borderWidth: 1 },
        areaStyle: { color: { type: "linear", x: 0, y: 0, x2: 0, y2: 1, colorStops: [
          { offset: 0, color: accent + "52" }, { offset: 1, color: accent + "08" }
        ] } }
      }]
    }), true);
  }

  window.addEventListener("resize", () => chart.resize());
}

/* ---------- 交互 ---------- */
document.querySelectorAll(".range .btn").forEach(b => {
  b.addEventListener("click", function () {
    document.querySelectorAll(".range .btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    range = parseInt(b.dataset.range, 10);
    renderDashboard();
  });
});

const cfgBtn = document.getElementById("cfgBtn");
const cfgPanel = document.getElementById("cfgPanel");
const mask = document.getElementById("mask");

function openCfg() {
  document.querySelectorAll(".cfg-panel input[data-card]").forEach(cb => {
    cb.checked = cfg.cards.indexOf(cb.dataset.card) >= 0;
  });
  const modeRadio = document.querySelector('.cfg-panel input[name="mode"][value="' + cfg.mode + '"]');
  if (modeRadio) modeRadio.checked = true;
  cfgPanel.hidden = false;
  mask.hidden = false;
}
function closeCfg() { cfgPanel.hidden = true; mask.hidden = true; }

cfgBtn.addEventListener("click", openCfg);
mask.addEventListener("click", closeCfg);
document.getElementById("cfgCancel").addEventListener("click", closeCfg);
document.getElementById("cfgSave").addEventListener("click", function () {
  const cards = [];
  document.querySelectorAll('.cfg-panel input[data-card]:checked').forEach(cb => cards.push(cb.dataset.card));
  let mode = "balance";
  const mr = document.querySelector('.cfg-panel input[name="mode"]:checked');
  if (mr) mode = mr.value;
  cfg = { cards: cards, mode: mode };
  saveCfg(cfg);
  closeCfg();
  renderDashboard();
});

renderDashboard();
boot();
</script>
</body>
</html>
